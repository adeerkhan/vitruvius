<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <!-- Background -->
  <rect width="800" height="280" fill="#f8f9fa" rx="8"/>

  <!-- Input files -->
  <g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    <!-- Position Posting -->
    <rect x="20" y="20" width="120" height="50" rx="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
    <text x="80" y="42" fill="white" font-weight="600">Position Posting</text>
    <text x="80" y="58" fill="white" font-size="10">PDF / Image / URL</text>

    <!-- CV -->
    <rect x="160" y="20" width="100" height="50" rx="6" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
    <text x="210" y="42" fill="white" font-weight="600">CV</text>
    <text x="210" y="58" fill="white" font-size="10">PDF</text>

    <!-- Personal Statement -->
    <rect x="280" y="20" width="140" height="50" rx="6" fill="#9b59b6" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="350" y="42" fill="white" font-weight="600">Personal Statement</text>
    <text x="350" y="58" fill="white" font-size="10">PDF (optional)</text>

    <!-- Arrows down to Phase 0 -->
    <path d="M80 75 L80 100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <path d="M210 75 L210 100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <path d="M350 75 L350 100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Phase 0: Parse -->
    <rect x="20" y="105" width="400" height="45" rx="6" fill="#34495e" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="220" y="125" fill="white" font-weight="600">Phase 0: Parse &amp; Research</text>
    <text x="220" y="142" fill="#bdc3c7" font-size="10">Extract profile, posting data, research professor/lab</text>

    <!-- Arrow -->
    <path d="M220 155 L220 175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Phase 1-3: Analysis -->
    <rect x="20" y="180" width="120" height="45" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="80" y="200" fill="white" font-weight="600" font-size="11">Gap Analysis</text>
    <text x="80" y="215" fill="white" font-size="9">general + lab</text>

    <rect x="150" y="180" width="120" height="45" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="210" y="200" fill="white" font-weight="600" font-size="11">Evidence Rank</text>
    <text x="210" y="215" fill="white" font-size="9">tier scoring</text>

    <rect x="280" y="180" width="120" height="45" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="340" y="200" fill="white" font-weight="600" font-size="11">Verification</text>
    <text x="340" y="215" fill="white" font-size="9">8 checks</text>

    <!-- Arrow -->
    <path d="M220 230 L220 250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Phase 4-5: Write & Humanize -->
    <rect x="450" y="105" width="150" height="45" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
    <text x="525" y="125" fill="white" font-weight="600">Write Proposal</text>
    <text x="525" y="142" fill="white" font-size="10">deep fit analysis</text>

    <rect x="620" y="105" width="150" height="45" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
    <text x="695" y="125" fill="white" font-weight="600">Humanize</text>
    <text x="695" y="142" fill="white" font-size="10">match your voice</text>

    <!-- Arrow from analysis to write -->
    <path d="M420 202 L450 150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Arrow from write to humanize -->
    <path d="M605 150 L620 150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Output: binder.md -->
    <rect x="450" y="180" width="320" height="45" rx="6" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
    <text x="610" y="200" fill="white" font-weight="600">binder.md</text>
    <text x="610" y="217" fill="white" font-size="10">final output with all appendices</text>

    <!-- Arrow from humanize to binder -->
    <path d="M695 150 L695 180" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Output artifacts -->
    <g font-size="9" fill="#666">
      <rect x="450" y="235" width="70" height="16" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
      <text x="485" y="247" text-anchor="middle">profile.json</text>

      <rect x="525" y="235" width="70" height="16" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
      <text x="560" y="247" text-anchor="middle">posting.json</text>

      <rect x="600" y="235" width="90" height="16" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
      <text x="645" y="247" text-anchor="middle">professor-research.json</text>

      <rect x="695" y="235" width="70" height="16" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
      <text x="730" y="247" text-anchor="middle">verdict.md</text>
    </g>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>
</svg>
