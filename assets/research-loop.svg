<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Background -->
  <rect width="800" height="200" fill="#f8f9fa" rx="8"/>

  <!-- Research Loop Steps -->
  <g font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
    <!-- Plan -->
    <rect x="20" y="60" width="90" height="50" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="65" y="90" fill="white" font-weight="600">Plan</text>

    <!-- Arrow -->
    <path d="M115 85 L135 85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scale -->
    <rect x="140" y="60" width="90" height="50" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="185" y="90" fill="white" font-weight="600">Scale</text>

    <!-- Arrow -->
    <path d="M235 85 L255 85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Gather -->
    <rect x="260" y="60" width="90" height="50" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="305" y="90" fill="white" font-weight="600">Gather</text>

    <!-- Arrow -->
    <path d="M355 85 L375 85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Draft -->
    <rect x="380" y="60" width="90" height="50" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="425" y="90" fill="white" font-weight="600">Draft</text>

    <!-- Arrow -->
    <path d="M475 85 L495 85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Cite -->
    <rect x="500" y="60" width="90" height="50" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="545" y="90" fill="white" font-weight="600">Cite</text>

    <!-- Arrow -->
    <path d="M595 85 L615 85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Review -->
    <rect x="620" y="60" width="90" height="50" rx="6" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="665" y="90" fill="white" font-weight="600">Review</text>

    <!-- Arrow -->
    <path d="M715 85 L735 85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Deliver -->
    <rect x="730" y="60" width="60" height="50" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
    <text x="760" y="82" fill="white" font-weight="600" font-size="11">Deliver</text>
    <text x="760" y="98" fill="white" font-size="9">.md</text>

    <!-- Provenance sidecar -->
    <line x1="65" y1="115" x2="760" y2="115" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>
    <rect x="320" y="125" width="160" height="40" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
    <text x="400" y="143" fill="#333" font-weight="600" font-size="12">.provenance.md</text>
    <text x="400" y="158" fill="#666" font-size="10">source accounting + verification status</text>

    <!-- Verification badges -->
    <g font-size="9" fill="#666">
      <rect x="20" y="170" width="50" height="18" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="0.5"/>
      <text x="45" y="183" text-anchor="middle" fill="#155724">verified</text>

      <rect x="75" y="170" width="50" height="18" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="0.5"/>
      <text x="100" y="183" text-anchor="middle" fill="#856404">partial</text>

      <rect x="130" y="170" width="50" height="18" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="0.5"/>
      <text x="155" y="183" text-anchor="middle" fill="#721c24">blocked</text>

      <rect x="185" y="170" width="60" height="18" rx="3" fill="#e2e3e5" stroke="#6c757d" stroke-width="0.5"/>
      <text x="215" y="183" text-anchor="middle" fill="#383d41">unverified</text>
    </g>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>
</svg>
