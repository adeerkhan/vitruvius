name: Vitruvius CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 fetches the full history. Nothing in `npm test` reads
      # historical objects today, so depth-1 would work; kept at 0 because a
      # shallow clone silently turns any future history-reading gate into a
      # false accusation rather than an honest failure.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all tests
        run: npm test
