name: Vitruvius site

# Deploys site/ to GitHub Pages. The site is hand-written static HTML with no
# build step, so there is nothing to compile — this workflow exists to gate the
# deploy on the site's own check and to publish on every push to main.
#
# One-time setup, because the workflow cannot do it for you:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Without that selection the first run uploads an artifact that goes nowhere.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site/**"
      - ".github/workflows/pages.yml"
  # Deploy by hand without waiting for a push, and re-run a failed deploy.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Check the site
        run: node tests/site/test-site.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # enablement: true creates the Pages site (Source: GitHub Actions) when it
      # does not exist yet. Without it a repo that never enabled Pages fails
      # here with "Get Pages site failed", which is exactly how the first
      # deploy of this site failed.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4